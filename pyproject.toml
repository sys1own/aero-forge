[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-forge"
version = "0.1.0"
description = "LLM-integrated build tool that transpiles Python functions to native Rust and C++ extensions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0,<3.0",
    "click>=8.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-python>=0.20.0",
    "tree-sitter-rust>=0.20.0",
    "tree-sitter-cpp>=0.20.0",
    "pydantic",
    "pyyaml>=5.0",
    "tomli>=2.0.0",
    "numpy",
    "pybind11",
    "networkx",
    "blake3",
    "z3-solver",
    "websockets>=10.0",
    "aiohttp>=3.8",
]

[project.optional-dependencies]
dev = ["pytest", "black"]
gemini = ["google-generativeai>=0.7.0"]

[project.scripts]
aero-forge = "aero_forge.cli:main"
aero = "aero_forge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "stress_tests/test_stress.py", "stress_tests/test_llm_rate_limits.py"]
markers = [
    "integration: marks tests that compile or run external tooling",
    "slow: marks tests that may be slow to run",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aero_forge*"]

[tool.setuptools.package-data]
aero_forge = ["templates/*"]
aero_forge_his = ["*.so"]
