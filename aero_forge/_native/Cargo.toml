[package]
name = "aero_forge_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "aero_forge_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
blake3 = { version = "=1.5.3", features = ["rayon", "mmap"] }
constant_time_eq = "=0.3.1"
rayon = "1"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
smallvec = "1.11"
ndarray = "0.15"
egg = "0.9"
ordered-float = "3"
base64 = "0.22"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
# Pin transitive build dependencies so fresh workspaces (no Cargo.lock) still
# build on the rustc 1.83 toolchain used by the project.
jobserver = "=0.1.32"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true
