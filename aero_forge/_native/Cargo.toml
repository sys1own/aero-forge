[package]
name = "aero_forge_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "aero_forge_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
blake3 = { version = "=1.5.4", features = ["rayon", "mmap"] }
constant_time_eq = "=0.3.1"
rayon = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true
